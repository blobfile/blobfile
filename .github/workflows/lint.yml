name: Static checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install -e ".[s3]"
      - run: pip install lxml-stubs
      - run: pip install 'pyright>=1.1.411,<1.1.412'
      - run: pyright
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install 'ruff>=0.15,<0.16'
      - run: ruff check .
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install 'black>=26,<27'
      - run: black --check --diff .
